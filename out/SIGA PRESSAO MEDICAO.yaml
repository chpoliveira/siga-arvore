    - "Nunca para escoar água servida ou pluvial; sem contato com corrosivos."
  segue: ENSAIO

# ===================================================== 10. ENSAIO E COMISSIONAMENTO
- id: ENSAIO
  resultado: Limpeza, verificação de obstrução e ensaio de estanqueidade com ar comprimido ou gás inerte. Emitir o Laudo de Estanqueidade.
  status: ok
  ref: "10.6.1, 10.6.2, p.129 e 130"
  numeros:
  - valor: 1,5 x
    rotulo: pressão máxima de operação, no ensaio
  - valor: 60 + 15 min
    rotulo: ensaio e estabilização
  - valor: 2 bar
    rotulo: limpeza de rede nova, abaixo da pressão de ensaio
  info:
  - titulo: Ensaio
    itens:
    - "Rede exposta, por partes ou inteira; válvulas abertas, inclusive dos pontos; extremidades com plugue, cap ou flange cego."
    - "Manômetro calibrado, com a pressão entre 25 e 75% do fundo de escala, divisões de até 1%."
    - "Subir a pressão em degraus de até 10%; separar a fonte ao atingir o valor; nenhuma variação durante o ensaio."
    - "Queda de pressão: localizar, reparar e repetir. Depois despressurizar e manter os plugues."
  - titulo: Válvulas de bloqueio (10.2)
    itens:
    - "Em cada abrigo de regulagem, torre, prumada, quadro de medidores, unidade (medidor ou by-pass) e ponto de utilização."
    - "Esfera, conforme EN 331, NBR 15526 e NBR 15358; entre 0,20 e 1,80 m do piso."
  segue: COMISS

- id: COMISS
  resultado: Comissionamento pela Comgás, com o laudo de estanqueidade em mãos, válvulas dos pontos fechadas ou tamponadas, aparelhos instalados e ambientes abertos ao exterior. A rede está comissionada quando cheia de gás, vedada e sem vazamento.
  status: ok
  ref: "10.6.3, p.130; ARSESP Deliberação 7321/2017"
  info:
  - titulo: Descomissionamento (10.6.4)
    itens:
    - "Por gasista certificado; purga com queima nos aparelhos ou em flare externo; inertização na pressão de operação."
    - "Até 50 l de volume: ar comprimido. Acima: gás inerte. Monitorar com oxi-explosímetro."
  - titulo: Projeto (10)
    itens:
    - "Projeto por profissional com registro no CREA ou CAU, com ART ou RRT."

lacunas:
- 'Altura da prumada (5.2.3): o SIGA não define a cota de referência da altura nem trata o caso de exatamente 80 m. Proposta para a revisão: medir do regulador que alimenta a prumada, de 1º ou 2º estágio, até o ponto de utilização mais alto, e substituir "acima de" e "abaixo de" por "maior que" e "menor ou igual a".'
- 'Medição coletiva abaixo de 80 m (5.2.3): o 75 mbar aparece vinculado à medição individual e a nota dos 50% não cita a medição coletiva.'
- 'Pressão de entrada do 1º estágio, 4 bar ou 350 mbar, aparece só no fluxo comercial da carta de viabilidade (12.6, p.331), não no capítulo 5.'
- 'As figuras do Anexo B não informam a pressão de operação da prumada, 25 ou 75 mbar. O projetista precisa cruzar cada tipologia com o 5.2.3.'
- 'B.10 e B.11 (p.229 e 230) têm o mesmo título. Sugestão: B.10 "...interno à unidade (Hoot) com estabilizador junto ao medidor"; B.11 "...interno à unidade (Hoot) com estabilizadores junto aos aparelhos".'
- 'B.27 e B.28 (p.238) têm o mesmo título. Sugestão: B.27 "...interno à unidade (Hoot) com estabilizador junto ao medidor"; B.28 "...interno à unidade (Hoot) com estabilizadores junto aos aparelhos".'
- 'B.35 e B.36 (p.242) têm o mesmo título. Sugestão: B.35 "...medição coletiva no alinhamento predial, by-pass na unidade e estabilizador junto ao aparelho"; B.36 "...medição coletiva no alinhamento predial e by-pass com estabilizador na unidade".'
- 'Volume mínimo com aparelhos entre 16 e 30 kW (7.1.1.1): V = soma das potências menos 10 dá menos de 6 m³ para somas abaixo de 16 kW; o texto não diz que o piso de 6 m³ continua valendo, embora o 7.4 diga isso para aparelhos associados.'
- 'Regulador junto ao aparelho acima de 80 m (5.2.3): o texto cita os requisitos de ventilação dos itens 6.1 e 8 só no caso abaixo de 80 m.'
