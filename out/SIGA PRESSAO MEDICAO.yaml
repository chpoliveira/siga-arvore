- id: LAT_MATERIAL
  pergunta: Qual o material do tubo?
  ref: "10.3.1, p.121 a 127"
  opcoes:
  - texto: Aço carbono
    vai: MAT_ACO
  - texto: Cobre rígido
    vai: MAT_COBRE
  - texto: Multicamada ou aço revestido com PE
    vai: MAT_PE

- id: MAT_ACO
  resultado: Tubo preto ou galvanizado, classe média NBR 5580 ou classe normal NBR 5590. Conexões NBR 6943 ou ASME B16.9; solda por eletrodo revestido ou com gás de proteção.
  status: ok
  ref: "10.3.1, Tabela 12"
  info:
  - titulo: Rosca
    itens:
    - "NPT cônica (NBR 12912) ou BSP macho cônica e fêmea paralela (ISO 7-1). Vedante: fita PTFE ou fio de poliamida. Tinta e fibra vegetal são proibidas."
  - titulo: Proteção
    itens:
    - "Embutida ou enterrada: pintura epóxi, tinta asfáltica ou fita de petrolato, 5 cm além do afloramento (10.4)."
    - "Interligar ao BEP no térreo com cobre de 6 mm²; a 2 m das descidas do SPDA; nunca usar o gás como aterramento (10.5)."

- id: MAT_COBRE
  resultado: Cobre rígido sem costura NBR 13206, conexões NBR 11720. Brasagem (solda forte, fusão acima de 450 °C) em qualquer trecho; solda branda (acima de 200 °C) só até 1,5 bar.
  status: ok
  ref: "10.3.1, Tabela 13, p.122"

- id: MAT_PE
  resultado: Multicamada ou aço revestido com polietileno. Externo à edificação em prédio até 60 m, sem exigência de aterramento. A 40 cm de anel de equipotencialização aparente.
  status: ok
  ref: "10.3.1, 10.5, p.128"

- id: T_APARENTE
  resultado: Tubulação aparente, pintada de amarelo (Munsell 5Y8/12, Pantone 110) e identificada com GÁS a cada 10 m. Em fachada ou área privativa, cor livre com a palavra GÁS a cada 10 m.
  status: ok
  ref: "10.1.1, p.111 e 112"
  numeros:
  - valor: 5 cm
    rotulo: do piso em trechos horizontais
  - valor: 1,50 m
    rotulo: abaixo disso, proteção mecânica em área de risco
  - valor: 1,5 x
    rotulo: diâmetro da luva de proteção
  info:
  - titulo: Regras
    itens:
    - "Não passa por espaço fechado, permanência prolongada ou local sem manutenção."
    - "Suportes em trecho reto, perto de válvulas e medidores, isolados do tubo metálico com nylon, borracha ou PVC; nunca fixados em outras tubulações."
    - "Proteção mecânica em garagens, áreas externas e comuns: tubo 1,5 vezes maior, chapa ou argamassa."
  segue: ENSAIO

- id: T_EMBUTIDA
  resultado: Embutida em alvenaria ou contrapiso com recobrimento mínimo de 2 cm. Proibida em drywall, em parede de espaço fechado e onde não houver inspeção.
  status: ok
  ref: "10.1.2, p.113"
  numeros:
  - valor: 2 cm
    rotulo: recobrimento mínimo
  - valor: 5 cm
    rotulo: do piso em trecho horizontal
  info:
  - titulo: Regras
    itens:
    - "Em permanência prolongada: embutida na face oposta ao ambiente."
    - "Em sanitário: sempre embutida. Com aparelho tipo C, só o ponto fica aparente."
    - "Proteção contra produtos químicos e corrosão."
  segue: ENSAIO

- id: T_ENTERRADA
  resultado: Enterrada com 30 cm sem tráfego, 60 cm com tráfego de veículos, 80 cm em jardim ou área de escavação, medidos da geratriz superior.
  status: ok
  ref: "10.1.3, p.114"
  numeros:
  - valor: 30 cm
    rotulo: sem tráfego
  - valor: 60 cm
    rotulo: com tráfego de veículos
  - valor: 80 cm
    rotulo: jardim ou escavação
  - valor: 30 cm
    rotulo: de outras utilidades, ou a Tabela 11 se maior
  info:
  - titulo: Regras
    itens:
    - "Dentro da edificação, nunca sob laje estrutural; sob laje vai em sulco preenchido com areia."
    - "Sem profundidade: placa de concreto ou argamassa 10 cm acima do tubo."
    - "Proteção contra corrosão; tachão ou placa a cada 10 m, ou fita de advertência a 20 cm acima do tubo."
    - "Atravessa fundação sem ficar solidária à estrutura."
  segue: ENSAIO

- id: T_SHAFT
  resultado: Shaft dedicado ou compartilhado com sistemas hidráulicos, nunca elétricos. Ventilação conforme a comunicação entre pavimentos.
  status: ok
  ref: "10.1.5, p.117 e 118"
  numeros:
