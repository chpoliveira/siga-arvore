    itens:
    - "As duas extremidades abertas para o exterior, ou para ambientes ventilados ao exterior, abrigo de medidor ventilado ou shaft ventilado."
    - "Extremidades protegidas contra água e objetos."
    - "Nunca solidária a laje, viga ou parede estrutural; pode ir em sulco."
  segue: ENSAIO

- id: T_CANALETA
  resultado: Canaleta de piso exclusiva para gás, com grade 50% vazada, caimento de 1% para dreno e 10 cm livres de cada lado do tubo.
  status: ok
  ref: "10.1.6, p.119"
  numeros:
  - valor: 50%
