    rotulo: Ø75 mm, ventilação para o exterior
  - valor: 400 cm²
    rotulo: para o ambiente interno, que tem 200 cm² ao exterior
  info:
  - titulo: Alternativas
    itens:
    - "Sem comunicação entre pavimentos: 44 cm² por pavimento, junto à laje, para o exterior."
    - "Com comunicação entre pavimentos: 44 cm² na base e 44 cm² no topo."
    - "Ventilação indireta: 400 cm² para o ambiente junto ao teto, com o ambiente abrindo 200 cm² ao exterior; ou prumada de ventilação Ø100 com ramal Ø75 a 45°; ou duto próprio de 44 cm²."
    - "Exceção admitida no shaft: tomada do aquecedor, quando inevitável."
  segue: ENSAIO

- id: T_LUVA
  resultado: Tubo luva com diâmetro interno de 1,5 vez o externo do tubo de gás, retilíneo, estanque, incombustível, com 2 cm de saliência nas extremidades quando atravessa estrutura.
  status: ok
  ref: "10.1.4, p.115 e 116"
  numeros:
  - valor: 1,5 x
    rotulo: diâmetro interno da luva
  - valor: 2 cm
    rotulo: saliência nas extremidades
  info:
