tipo: arvore_decisao
projeto:
  titulo: Roteiro de projeto de gás pelo SIGA Comgás
  subtitulo: Prédio residencial, da viabilidade ao comissionamento. Responda em ordem; clique no cartão para abrir a ficha do passo no painel. As perguntas laterais aprofundam sem mudar o caminho.
  fonte: SIGA Comgás 09-2026
  revisao: R02
inicio: REDE

# Notação: ver docstring de src/arvore_df.py.
# Campos de ficha: alerta, numeros, info, laterais. Citações em ref.

nos:

# ===================================================== 1. ENTRADA E VIABILIDADE
- id: REDE
  pergunta: Existe rede da Comgás na rua do empreendimento?
  ref: "12.6, p.331"
  nota: Consulte nossarede.comgas.com.br pelo endereço. A consulta é indicativa, sem garantia de fornecimento.
  info:
  - titulo: Para pedir a carta de viabilidade
    itens:
    - "Data de entrega da obra"
    - "Endereço do ramal (entrada do gás) e quantidade de ramais"
    - "Tipo de medição: individual ou coletiva"
    - "Pressão da prumada: 25 ou 75 mbar"
    - "Quantidade de unidades, tipo e quantidade de aparelhos"
    - "Croqui do terreno com o abrigo de entrada"
  opcoes:
  - texto: Sim
    vai: PRESSAO_RUA
  - texto: Não
    vai: EXTENSAO

- id: EXTENSAO
  resultado: Extensão de rede. Estudo de viabilidade técnica e financeira da Comgás.
  status: atencao
  ref: "12.6, p.331"
  numeros:
  - valor: 90 dias úteis
    rotulo: prazo do estudo, dependendo de solo e interferências
  segue: ABRIGO

- id: PRESSAO_RUA
  pergunta: Qual a pressão da rede da Comgás na rua?
  ref: "12.6, p.331"
  opcoes:
  - texto: 4 bar
    vai: VIAB_4BAR
  - texto: 350 mbar
    vai: VIAB_350

- id: VIAB_4BAR
  resultado: Carta de viabilidade com emissão imediata.
  status: ok
  ref: "12.6, p.331"
  segue: ABRIGO

- id: VIAB_350
  resultado: Carta de viabilidade após análise de capacidade da rede.
  status: atencao
  ref: "12.6, p.331"
  numeros:
  - valor: 60 dias
    rotulo: prazo da análise
  segue: ABRIGO

- id: ABRIGO
  resultado: Reservar o abrigo de 1º estágio (ou estágio único) no alinhamento ou a até 5 m dele, em área não edificada. O abrigo existe mesmo quando não há regulagem; a Comgás instala um by-pass.
  status: info
  ref: "5.4, 5.6, p.35"
  nota: Ramal de serviço, regulador e medidores são fornecidos e instalados pela Comgás. O ramal não pode passar por propriedade privativa de terceiros.
  numeros:
  - valor: 5 m
    rotulo: distância máxima do alinhamento
  - valor: 1 bar
    rotulo: saída máxima do 1º estágio (ou 350 ou 75 mbar)
  - valor: 200 m³/h
    rotulo: vazão máxima por regulador
  info:
  - titulo: Requisitos do abrigo (5.6)
    itens:
    - "Pode ficar sobre área edificada e faceado à edificação, embutido ou não."
    - "Posição livre de árvores, bocas de lobo, caixas de inspeção e postes; ramal perpendicular ao duto da rua."
    - "Na propriedade do consumidor, com acesso sem escada móvel ou marinheiro."
    - "Ventilação permanente de 10% da planta baixa quando externo; furo de 44 cm² (Ø75 mm) quando em ambiente sem ventilação, a 1,20 m de outra abertura."
    - "Material não metálico; porta pode ser metálica, de preferência telada."
    - "Abrigo exposto a veículos: barreira de proteção (postes ou para-rodas)."
    - "Espaço livre de 60 cm à frente da porta aberta; acesso com vão mínimo de 2,10 x 0,60 m."
    - "Luminária à prova de explosão se houver iluminação interna; interruptor do lado de fora."
  - titulo: Prazo de obra
    itens:
    - "O abrigo próximo ao alinhamento deve estar pronto 6 meses antes da ligação (12.6, p.332)."
  laterais:
  - LAT_ESTAGIOS
  segue: VAZAO_TOTAL

- id: LAT_ESTAGIOS
  pergunta: Quantos estágios de regulagem o empreendimento precisa?
  ref: "5.4.1, p.35"
  nota: Mais estágios reduzem o diâmetro da tubulação em ramais longos ou de vazão alta.
  opcoes:
  - texto: Um estágio
    vai: EST_1
  - texto: Dois estágios
    vai: EST_2
  - texto: Três estágios
    vai: EST_3

- id: EST_1
  resultado: Regulador de estágio único no alinhamento, com saída direta na pressão dos aparelhos. Residencial, 25 mbar.
  status: ok
  ref: "5.4, p.35"

- id: EST_2
  resultado: 1º estágio no alinhamento, saída até 1 bar, 350 ou 75 mbar. 2º estágio dentro do empreendimento, reduzindo para 350, 75 ou 25 mbar.
  status: ok
  ref: "5.4.1, p.35"

- id: EST_3
  resultado: 1º e 2º estágios como no caso anterior. 3º estágio (estabilizador) junto ao aparelho, reduzindo para 25 mbar.
  status: ok
  ref: "5.4.1, p.35"

# ===================================================== 2. VAZÃO TOTAL
- id: VAZAO_TOTAL
  pergunta: A vazão total do empreendimento passa de 200 m³/h?
  ref: "5.3"
  nota: Some as vazões nominais dos pontos de utilização, com ou sem fator de simultaneidade.
  laterais:
  - LAT_SIMULT
  opcoes:
  - texto: Não, até 200 m³/h
    vai: MUNICIPIO
  - texto: Sim, acima de 200 m³/h
    vai: NOVO_RAMAL

- id: LAT_SIMULT
  pergunta: Qual a potência acumulada do trecho, em kcal/h?
  ref: "11.1.4, p.138"
  nota: Vale para rede interna, ramal interno e prumadas coletivas de edificações residenciais e salas comerciais.
  opcoes:
  - texto: Até 23.343 kcal/h
    vai: F_1
  - texto: Entre 23.343 e 5.609.943 kcal/h
    vai: F_CURVA
  - texto: Acima de 5.609.943 kcal/h
    vai: F_010

- id: F_1
  resultado: Fator de simultaneidade F = 1. Vazão Q = C x F / PCI, com PCI = 8.600 kcal/m³.
  status: info
  ref: "11.1.4"

- id: F_CURVA
  resultado: F = 68,334 x C^(-0,42). Vazão Q = C x F / PCI, com PCI = 8.600 kcal/m³.
  status: info
  ref: "11.1.4"
  info:
  - titulo: Exemplo
    itens:
    - "C = 100.000 kcal/h: F = 68,334 x 100.000^-0,42 = 0,55. Q = 100.000 x 0,55 / 8.600 = 6,4 m³/h."
    - "Piscina, central de aquecimento e lavanderia coletiva: o projetista define a simultaneidade pelo uso real."

- id: F_010
  resultado: Fator de simultaneidade F = 0,10. Vazão Q = C x 0,10 / 8.600.
  status: info
  ref: "11.1.4"

- id: NOVO_RAMAL
  resultado: Prever novo ramal de serviço para a vazão excedente. As redes internas de ramais independentes não podem ser interligadas.
  status: atencao
  ref: "5.3 nota"
  segue: MUNICIPIO

# ===================================================== 3. MEDIÇÃO
- id: MUNICIPIO
  pergunta: O município exige medição individual de consumo?
  ref: "5.5"
  info:
  - titulo: Medição por uso
    itens:
    - "Cada uso tem medidor exclusivo e tarifa própria: aquecimento individual ou cocção; aquecimento central coletivo; piscinas; cogeração; refrigeração."
    - "Piscina e aquecimento central coletivo podem compartilhar um medidor se as instalações estiverem próximas."
    - "Residencial: medição em 350, 75 ou 25 mbar, até 200 m³/h por conjunto."
  opcoes:
  - texto: Sim
    vai: LOCAL_MED
  - texto: Não
    vai: TIPO_MED

- id: TIPO_MED
  pergunta: Qual o tipo de medição do empreendimento?
  ref: "5.5"
  opcoes:
  - texto: Coletiva
    vai: COLETIVA
  - texto: Individual
    vai: LOCAL_MED

- id: COLETIVA
  resultado: Medição coletiva. O condomínio rateia o consumo. Prever by-pass em cada unidade para futura medição individual.
  status: ok
  ref: "5.5, 5.5.1, Anexo B"
  numeros:
  - valor: 10
    rotulo: medidores por bloco ou prumada, no máximo
  - valor: 200 m³/h
    rotulo: vazão máxima total
  info:
  - titulo: Tipologias do Anexo B
    itens:
    - "B.31 a B.34: estágio único ou dois estágios, medição coletiva no alinhamento ou no limite da edificação, by-pass na unidade."
    - "B.35: dois estágios, by-pass na unidade e estabilizador junto ao aparelho (p.242)."
    - "B.36: dois estágios, by-pass com estabilizador incorporado na unidade (p.242)."
  segue: ALT_COL

- id: LOCAL_MED
  pergunta: Onde ficam os medidores individuais?
  ref: "5.5.2"
  nota: O sistema de medição fica, de preferência, junto ao alinhamento predial.
  opcoes:
  - texto: Alinhamento ou limite da edificação
    vai: L_ALINH
  - texto: Hall dos andares
    vai: L_HALL
  - texto: Área comum ou área técnica
    vai: L_COMUM
  - texto: Dentro da unidade (Hoot)
    vai: L_HOOT

- id: L_ALINH
  resultado: Medidores em abrigo coletivo no alinhamento ou no limite da edificação.
  status: ok
  ref: "5.6, Anexo B"
  info:
  - titulo: Tipologias
    itens:
    - "B.37 e B.38: estágio único."
    - "B.42: dois estágios, medição no limite da edificação."
    - "B.47: três estágios, vazão acima de 6 m³/h por unidade."
  - titulo: Conjunto de medição
    itens:
    - "Tubulação rígida que suporte o peso dos medidores; válvula de bloqueio setorizada; válvula do medidor a montante, no ponto A."
    - "Reforço do quadro a partir de 7 medidores (Figura 13)."
  segue: ALT_IND

- id: L_HALL
  resultado: Medidores em abrigo no hall dos andares. O abrigo precisa de ventilação própria para o exterior e porta estanque.
  status: ok
  ref: "5.6, p.55, Anexo B"
  info:
  - titulo: Tipologias
    itens:
    - "B.39: estágio único."
    - "B.43: dois estágios."
    - "B.48: dois estágios, vazão acima de 6 m³/h por unidade."
  - titulo: Ventilação do abrigo no hall (p.55)
    itens:
    - "Parede adjacente ao exterior: furo de 44 cm² (Ø75 mm) na parte superior, a 1,20 m de outra abertura."
    - "Sem parede externa: prumada de ventilação Ø100 mm com ramal Ø75 mm a 45°, até 50 cm, extremidades livres e teladas."
    - "Prumada no shaft em tubo luva: extremidade inferior do tubo luva vedada dentro do abrigo."
    - "Prumada aparente no shaft: porta do shaft não estanque, duas aberturas de 200 cm²."
  segue: ALT_IND

- id: L_COMUM
  resultado: Medidores em área comum ou área técnica comum.
  status: ok
  ref: "5.6, Anexo B"
  info:
  - titulo: Tipologias
    itens:
    - "B.40: área comum, estágio único."
    - "B.44: área técnica comum, estágio único."
    - "B.49: três estágios, vazão acima de 6 m³/h por unidade."
    - "B.51 a B.53: medição em área comum com medidor separado para outras aplicações, como piscina."
  segue: ALT_IND

- id: L_HOOT
  resultado: Medidor inteligente Hoot dentro da unidade autônoma, com leitura remota.
  status: atencao
  ref: "5.5.2, p.57, 12.2 p.275 a 278"
  alerta: Contratar o fornecimento com Hoot com no mínimo 18 meses de antecedência da entrega do empreendimento.
  numeros:
  - valor: 200 cm²
    rotulo: ventilação permanente superior, ou 100 + 100 cm²
  - valor: 5 cm
    rotulo: afastamento livre nas laterais e acima
  - valor: 1,80 m
    rotulo: altura máxima dos pontos
  info:
  - titulo: Onde o Hoot pode ficar
    itens:
    - "Ambiente com ventilação para o exterior ou área técnica, direta ou por duto."
    - "Nunca em sanitário nem em ambiente de permanência prolongada."
    - "Local protegido de produtos químicos, passagem de pessoas e animais, de fácil acesso."
    - "Em armário ou nicho: porta própria e aberturas permanentes com 1/10 da planta baixa."
    - "Abrigo, quando houver, não metálico e com ventilação de 1/10 da planta baixa."
  - titulo: Afastamentos mínimos em raio (Tabela 07, p.58)
    tabela:
    - ["Aparelho ou elemento", "cm"]
    - ["Aquecedor, cooktop, fogão, churrasqueira", "20, nunca sobre eles"]
    - ["Forno, secadora, tomadas e interruptores, outros metálicos", "20"]
    - ["Armário de metal, coifa, chaminé, geladeira, lava-roupas, lava-louças", "10"]
  - titulo: Tipologias
    itens:
    - "B.41: estágio único. B.45: dois estágios. B.46 e B.50: vazão acima de 6 m³/h por unidade."
  segue: ALT_IND

# ===================================================== 4. PRESSÃO DA PRUMADA, MEDIÇÃO INDIVIDUAL
- id: ALT_IND
  pergunta: Qual a altura da prumada, do regulador que a alimenta até o último ponto de utilização?
  ref: "5.2.3"
  alerta: O SIGA fala em "prumada acima de 80 m de altura" sem dizer de onde medir. Este roteiro mede do regulador que alimenta a prumada, de 1º ou 2º estágio, até o ponto de utilização mais alto.
  info:
  - titulo: Pressões admitidas na rede interna (5.2)
    tabela:
    - ["Pressão", "Onde", "Restrição"]
    - ["1 bar", "Ramal interno enterrado em área externa ventilada", "Fora da projeção, a 50 cm dela"]
    - ["350 mbar", "Ramal interno, garagens e subsolos, inclusive sob a projeção", "Não pode em prumada"]
    - ["75 mbar", "Ramal interno e prumada", "Condições do 5.2.3"]
    - ["25 mbar", "Qualquer trecho", "Aparente em permanência prolongada só conforme 10.1.4.2"]
  opcoes:
  - texto: Até 80 m
    vai: VAZAO_UNID
  - texto: Acima de 80 m
    vai: IND_75_OBRIG

- id: IND_75_OBRIG
  resultado: Prumada em 75 mbar, obrigatória.
  status: ok
  ref: "5.2.3"
  numeros:
  - valor: 75 mbar
    rotulo: pressão da prumada
  segue: REG_IND

- id: REG_IND
  pergunta: Qual a vazão do medidor da unidade?
  ref: "5.2.3, Anexo A"
  nota: A vazão do medidor é a soma dos aparelhos da unidade. Use a pergunta lateral para estimar.
  info:
  - titulo: Medidores residenciais do Anexo A
    tabela:
    - ["Medidor", "Vazão", "Uso típico"]
    - ["G1", "1,6 m³/h", "Cocção"]
    - ["G1.6", "2,5 m³/h", "Cocção + aquecedor pequeno"]
    - ["G2.5", "4 m³/h", "Aquecedor até 23 l/min"]
    - ["G4", "6 m³/h", "Aquecedor até 35 l/min"]
    - ["G6", "10 m³/h", "Acima de 35 l/min ou dois aquecedores"]
  laterais:
  - LAT_APAR
  opcoes:
  - texto: Até 6 m³/h
    vai: REG_MEDIDOR
  - texto: Acima de 6 m³/h
    vai: REG_APARELHO

- id: LAT_APAR
  pergunta: Qual o aparelho de maior consumo da unidade?
  ref: "11.1.1, Tabelas 19 e 21, p.135 e 136"
  nota: Some a vazão dos demais aparelhos. Fogão 4 bocas com forno 0,81 m³/h; cooktop 0,29; forno de embutir 0,44; churrasqueira 0,78; secadora 10 kg 0,70.
  opcoes:
  - texto: Só cocção
    vai: AP_COCCAO
  - texto: Aquecedor até 16 l/min
    vai: AP_AQ16
  - texto: Aquecedor de 23 a 26 l/min
    vai: AP_AQ26
  - texto: Aquecedor de 30 a 35 l/min
    vai: AP_AQ35
  - texto: Aquecedor de 44 a 46 l/min
    vai: AP_AQ46

- id: AP_COCCAO
  resultado: Fogão 4 bocas com forno 0,81 m³/h (8,14 kW). Medidor G1 ou G1.6. Unidade abaixo de 2 m³/h.
  status: info
  ref: "Tabela 19"

- id: AP_AQ16
  resultado: Aquecedor de 7 l/min B11 1,13 m³/h; 13 l/min B22 2,20; 16 l/min B22 2,60. Com fogão, 2 a 3,4 m³/h. Medidor G1.6 ou G2.5. Unidade acima de 2 m³/h a partir de 13 l/min.
  status: info
  ref: "Tabela 21"

- id: AP_AQ26
  resultado: Aquecedor de 23 l/min 3,80 m³/h (37,9 kW); 26 l/min 4,23 m³/h (42,2 kW). Com fogão, 4,6 a 5,0 m³/h. Medidor G4, até 6 m³/h.
  status: info
  ref: "Tabela 21"

- id: AP_AQ35
  resultado: Aquecedor de 30 l/min 4,90 m³/h; 32 l/min 5,27; 35 l/min 5,75 m³/h (57,4 kW). Com fogão passa de 6 m³/h; medidor G6.
  status: info
  ref: "Tabela 21"

- id: AP_AQ46
  resultado: Aquecedor de 46 l/min B23 7,65 m³/h (76,3 kW) ou 44 l/min tipo C 7,18 m³/h. Medidor G6, 10 m³/h. Unidade acima de 6 m³/h.
  status: info
  ref: "Tabela 21"

- id: REG_MEDIDOR
  resultado: Regulador de pressão (estabilizador) junto ao medidor, no pavimento ou dentro da unidade. A rede da unidade opera em 25 mbar.
  status: ok
  ref: "5.2.3, B.45"
  numeros:
  - valor: 75 mbar
    rotulo: prumada
  - valor: 25 mbar
    rotulo: rede da unidade
  info:
  - titulo: Perda de carga admissível (11.1.6)
    itens:
    - "Entre reguladores: até 30% da pressão de operação da linha."
    - "Do regulador aos pontos de utilização: até 10% da pressão de utilização."
    - "Velocidade do gás: até 20 m/s; acima disso, aumentar o diâmetro."
  segue: USO

- id: REG_APARELHO
  resultado: Medidor em 75 mbar e estabilizador junto a cada aparelho. A rede da unidade opera em 75 mbar.
  status: atencao
  ref: "5.2.3, Anexo B"
  alerta: Em 75 mbar o ambiente do aparelho precisa sempre de ventilação permanente, mesmo com volume folgado (8, p.86). Afastamento de 10 cm ao redor do estabilizador (6.1).
  numeros:
  - valor: 75 mbar
    rotulo: prumada e rede da unidade
  - valor: 10 cm
    rotulo: livre ao redor do estabilizador
  info:
  - titulo: Tipologias
    itens:
    - "B.46 e B.50: Hoot com vazão acima de 6 m³/h."
    - "B.47: medição no limite da edificação. B.48: hall. B.49: área comum."
    - "Perda de carga do regulador ao ponto: até 10% da pressão de utilização (11.1.6)."
  segue: USO

- id: VAZAO_UNID
  pergunta: A vazão da unidade passa de 2 m³/h?
  ref: "5.2.3"
  nota: Fogão com forno sozinho fica em 0,81 m³/h. Aquecedor de 13 l/min ou mais já passa de 2 m³/h com o fogão.
  laterais:
  - LAT_APAR
  opcoes:
  - texto: Sim
    vai: IND_75_OPC
  - texto: Não
    vai: REGRA_50

- id: IND_75_OPC
  resultado: Prumada em 75 mbar ou em 25 mbar, à escolha do projeto.
  status: ok
  ref: "5.2.3, p.51"
  info:
  - titulo: Se adotar 75 mbar
    itens:
    - "Regulador a montante do medidor, no hall ou dentro da unidade."
    - "Regulador no ponto de utilização: o ambiente atende ventilação e ponto de consumo para 75 mbar (itens 6.1 e 8)."
  - titulo: Perda de carga admissível (11.1.6)
    itens:
    - "Entre reguladores: até 30%. Do regulador aos pontos: até 10% da pressão de utilização."
  segue: USO

- id: REGRA_50
  pergunta: Pelo menos metade das unidades da prumada passa de 2 m³/h, ou há aquecimento central coletivo?
  ref: "5.2.3 nota"
  opcoes:
  - texto: Sim
    vai: P75_NOTA
  - texto: Não
    vai: P25

- id: P75_NOTA
  resultado: Prumada em 75 mbar permitida para todas as unidades da prumada.
  status: ok
  ref: "5.2.3 nota"
  segue: USO

- id: P25
  resultado: Prumada em 25 mbar.
  status: ok
  ref: "5.2.4"
  numeros:
  - valor: 25 mbar
    rotulo: prumada e rede interna
  info:
  - titulo: Perda de carga admissível (11.1.6)
    itens:
    - "Do regulador aos pontos de utilização: até 10% da pressão de utilização, 2,5 mbar."
    - "Velocidade do gás até 20 m/s."
  segue: USO

# ===================================================== 5. PRESSÃO DA PRUMADA, MEDIÇÃO COLETIVA
- id: ALT_COL
  pergunta: Qual a altura da prumada, do regulador que a alimenta até o último ponto de utilização?
  ref: "5.2.3"
  alerta: O SIGA fala em "prumada acima de 80 m de altura" sem dizer de onde medir. Este roteiro mede do regulador que alimenta a prumada até o ponto de utilização mais alto.
  opcoes:
  - texto: Até 80 m
    vai: REGRA_50_COL
  - texto: Acima de 80 m
    vai: COL_75_OBRIG

- id: COL_75_OBRIG
  resultado: Prumada em 75 mbar, obrigatória.
  status: ok
  ref: "5.2.3"
  segue: REG_COL

- id: REG_COL
  pergunta: Qual a vazão da unidade?
  ref: "5.2.3"
  laterais:
  - LAT_APAR
  opcoes:
  - texto: Abaixo de 6 m³/h
    vai: REG_BYPASS
  - texto: Acima de 6 m³/h
    vai: REG_APARELHO_COL

- id: REG_BYPASS
  resultado: By-pass com estabilizador na unidade. Rede da unidade em 25 mbar.
  status: ok
  ref: "5.2.3, B.36, Anexo A.35"
  segue: USO

- id: REG_APARELHO_COL
  resultado: By-pass na unidade e estabilizador junto a cada aparelho. Rede da unidade em 75 mbar.
  status: atencao
  ref: "5.2.3, B.35"
  alerta: Em 75 mbar o ambiente do aparelho precisa sempre de ventilação permanente (8, p.86). Afastamento de 10 cm ao redor do estabilizador (6.1).
  segue: USO

- id: REGRA_50_COL
